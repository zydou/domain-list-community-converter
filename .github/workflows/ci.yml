---
name: CI

on:
  schedule:
    - cron: 0 16 * * *
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@main
        with:
          repository: v2fly/domain-list-community
          ref: master
          path: domain-list-community

      - name: Download mihomo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.local/bin
          gh release download v1.19.27 -O ~/.local/bin/mihomo.gz --pattern "*-linux-amd64-compatible-*.gz" --repo MetaCubeX/mihomo
          gzip -d ~/.local/bin/mihomo.gz
          chmod +x ~/.local/bin/mihomo

      - name: Customizations
        run: |
          # remove `github` from `microsoft`
          cp domain-list-community/data/microsoft domain-list-community/data/microsoft-without-github
          sed -i '/include:github/d' domain-list-community/data/microsoft-without-github

      - name: Convert
        run: |
          python3 convert.py

      - name: Push clash yaml
        env:
          BRANCH: clash
        run: |
          cd $BRANCH || exit 1
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config https.postBuffer 524288000
          git config core.compression -1
          git add .
          git commit -m "Released on $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push --force --quiet "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:$BRANCH

      - name: Push domain-set
        env:
          BRANCH: surge-domain-set
        run: |
          cd $BRANCH || exit 1
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config https.postBuffer 524288000
          git config core.compression -1
          git add .
          git commit -m "Released on $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push --force --quiet "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:$BRANCH

      - name: Push rule-set
        env:
          BRANCH: surge-rule-set
        run: |-
          cd $BRANCH || exit 1
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config https.postBuffer 524288000
          git config core.compression -1
          git add .
          git commit -m "Released on $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push --force --quiet "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:$BRANCH

      - name: Push mrs
        env:
          BRANCH: mrs
        run: |-
          cd $BRANCH || exit 1
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config https.postBuffer 524288000
          git config core.compression -1
          git add .
          git commit -m "Released on $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push --force --quiet "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:$BRANCH
